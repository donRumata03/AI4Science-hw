# Initial English schema. Week 4 acceptance is not asserted.
version: 2
classes:
  Method: {definition: Representation or generation procedure}
  Source: {definition: Identifiable primary reference}
  Hypothesis: {definition: Falsifiable research proposition}
  Metric: {definition: Explicitly defined measurement}
  Task: {definition: Request with acceptance and status}
  Report: {definition: Work and verification record}
  File: {definition: Physical repository file}
  GraphQuery: {definition: Executed external query with provenance}
relations:
  type: {domain: [Method, Source, Hypothesis, Metric, Task, Report, GraphQuery], range_kind: class}
  describes: {domain: [Source], range: [Method]}
  basedOn: {domain: [Method, Hypothesis], range: [Source]}
  comparedWith: {domain: [Method], range: [Method]}
  testedBy: {domain: [Hypothesis], range: [Method]}
  evaluatedWith: {domain: [Method], range: [Metric]}
  storedIn: {domain: [Source, Report], range: [File]}
  subtaskOf: {domain: [Task], range: [Task]}
  completes: {domain: [Report], range: [Task]}
  foundBy: {domain: [Source], range: [GraphQuery]}
attributes:
  status: {domain: [Task], values: [open, in_progress, done, accepted, blocked]}
  source_url: {domain: [Source, GraphQuery], datatype: string}
  accessed: {domain: [Source, GraphQuery], datatype: date}
rules:
  - id: R1
    statement: Every source has a source URL and access date; local PDFs have a storedIn link.
  - id: R2
    statement: A done task has a report or completed subtasks; accepted requires explicit user acceptance.
  - id: R3
    statement: Typed relation endpoints agree with their declared domain and range.
